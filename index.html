<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Times Tables">
<title>Times Tables</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --muted: #8e8e93;
    --faint: #48484a;
    --card: #1c1c1e;
    --card-down: #3a3a3c;
    --empty: #2c2c2e;
    --green: #30d158;
    --amber: #ff9f0a;
    --red: #ff453a;
    --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  button, .btn-small { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .c-green { background: var(--green) !important; }
  .c-amber { background: var(--amber) !important; }
  .c-red { background: var(--red) !important; }
  .t-green { color: var(--green) !important; }
  .t-amber { color: var(--amber) !important; }
  .t-red { color: var(--red) !important; }

  /* Screens */
  .screen {
    position: fixed; inset: 0; width: 100%; max-width: 480px; margin: 0 auto;
    display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .screen.active { display: flex; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* Home */
  .home-head h1 { font-family: var(--round); font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  .home-head p { color: var(--muted); font-size: 16px; margin-top: 4px; }
  .go-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
  .go {
    width: min(66vw, 36vh, 260px); aspect-ratio: 1; border-radius: 50%;
    background: var(--green); color: #000;
    font-family: var(--round); font-size: min(18vw, 10vh, 80px); font-weight: 900; letter-spacing: .02em;
    box-shadow: 0 0 0 12px rgba(48, 209, 88, .14), 0 0 80px rgba(48, 209, 88, .45);
    transition: transform .12s ease;
  }
  .go:active { transform: scale(.94); }
  .map-card {
    display: flex; align-items: center; gap: 16px; width: 100%;
    padding: 14px 18px 14px 14px; border-radius: 20px; background: var(--card); text-align: left;
  }
  .map-card:active { background: var(--card-down); }
  .mini { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; width: 96px; flex: none; }
  .mini i { aspect-ratio: 1; border-radius: 2px; background: var(--card-down); }
  .map-text { flex: 1; min-width: 0; }
  .map-text b { display: block; font-size: 18px; font-weight: 700; }
  .map-text span { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
  .chev { color: var(--faint); font-size: 30px; font-weight: 300; line-height: 1; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; }

  /* Play */
  .top { display: flex; align-items: center; gap: 14px; height: 40px; flex: none; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--card); color: var(--muted); font-size: 17px; display: grid; place-items: center; flex: none; }
  .icon-btn:active { background: var(--card-down); }
  .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--card); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .25s ease; }
  .qcount { color: var(--muted); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--round); font-variant-numeric: tabular-nums; }
  .sum { font-size: clamp(52px, min(19vw, 10.5vh), 112px); font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .sum.count { color: var(--green); animation: pop .55s ease-out; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .answer { font-size: clamp(44px, min(16vw, 9vh), 96px); font-weight: 700; line-height: 1.15; min-height: 1.15em; margin-top: 2.5vh; }
  .answer:empty::after { content: ""; display: inline-block; width: .5em; height: .07em; background: var(--fg); animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .answer.ok { color: var(--green); }
  .answer.bad { color: var(--red); text-decoration: line-through; text-decoration-thickness: .07em; }
  .reveal { font-size: clamp(30px, min(11vw, 6.5vh), 60px); font-weight: 800; color: var(--green); line-height: 1.2; min-height: 1.2em; margin-top: .5vh; }
  .stage.counting .answer, .stage.counting .reveal { visibility: hidden; }
  .intro-text, .intro-hint { display: none; text-align: center; }
  .intro-text { font-family: var(--sans); font-size: clamp(18px, 5.2vw, 22px); font-weight: 600; line-height: 1.4; max-width: 330px; margin-top: 3vh; text-wrap: balance; }
  .intro-hint { color: var(--muted); font-size: 14px; margin-top: 3vh; }
  .stage.intro .answer, .stage.intro .reveal { display: none; }
  .stage.intro .intro-text, .stage.intro .intro-hint { display: block; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: none; transition: opacity .2s ease; }
  .keypad.dim { opacity: .3; }
  .keypad button {
    height: clamp(52px, 8.2vh, 76px); border-radius: 16px; background: var(--card);
    font-family: var(--round); font-size: clamp(26px, 4vh, 34px); font-weight: 600; font-variant-numeric: tabular-nums;
    transition: background .08s;
  }
  .keypad button.down { background: var(--card-down); }
  .keypad .del { color: var(--muted); font-size: clamp(22px, 3.4vh, 28px); }

  /* Results */
  .res { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .res-score { font-family: var(--round); font-size: clamp(96px, min(36vw, 19vh), 168px); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .res-score small { font-size: .36em; color: var(--muted); font-weight: 700; letter-spacing: 0; }
  .res-msg { font-size: 19px; font-weight: 600; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 4.5vh; }
  .stat { background: var(--card); border-radius: 20px; padding: 18px 12px 16px; }
  .stat b { display: block; font-family: var(--round); font-size: clamp(30px, 9vw, 40px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
  .actions { display: flex; flex-direction: column; gap: 10px; flex: none; }
  .btn-go { height: 66px; border-radius: 33px; background: var(--green); color: #000; font-family: var(--round); font-size: 24px; font-weight: 900; transition: transform .1s; }
  .btn-go:active { transform: scale(.98); }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; height: 54px; border-radius: 27px; background: var(--card); font-size: 17px; font-weight: 600; display: grid; place-items: center; }
  .btn:active { background: var(--card-down); }
  .btn-ok { background: var(--green); color: #000; }
  .btn-danger { background: var(--red); color: #fff; }

  /* Heat map */
  #map { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #map > * { flex-shrink: 0; }
  .map-top { display: flex; align-items: center; justify-content: space-between; height: 40px; margin-bottom: 14px; }
  .back { color: var(--green); font-size: 17px; font-weight: 600; padding: 8px 8px 8px 0; }
  .map-top h2 { font-size: 17px; font-weight: 700; }
  .spacer { width: 64px; }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
  .hd { aspect-ratio: 1; display: grid; place-items: center; font-family: var(--round); font-size: clamp(10px, 2.9vw, 13px); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hd.on { color: var(--fg); }
  .hd.corner { color: var(--faint); }
  .sq { aspect-ratio: 1; border-radius: 4px; background: var(--empty); }
  .sq.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); position: relative; z-index: 1; }
  .info { min-height: 48px; margin: 16px 0 10px; font-size: 15px; line-height: 1.45; color: var(--muted); text-align: center; }
  .info b { color: var(--fg); font-weight: 700; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .legend div { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; flex: none; background: var(--card-down); }
  .legend span { flex: 1; color: var(--muted); font-size: 14px; }
  .legend b { font-family: var(--round); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .data { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
  .btn-small { display: inline-flex; align-items: center; padding: 10px 14px; border-radius: 20px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .btn-small:active { background: var(--card); }
  .btn-small.danger { color: var(--red); }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }

  /* Confirm sheet and toast */
  .modal { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .7); display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); animation: fade .15s ease-out; }
  .sheet { width: 100%; max-width: 440px; background: var(--card); border-radius: 24px; padding: 24px 18px 18px; }
  .sheet p { font-size: 17px; line-height: 1.4; text-align: center; margin-bottom: 20px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); z-index: 50; transform: translate(-50%, 16px); background: #2c2c2e; padding: 12px 18px; border-radius: 22px; font-size: 15px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Level up */
  .levelup { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px); animation: fade .25s ease-out; }
  .lvl-body { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh; text-align: center; }
  .lvl-text { font-family: var(--round); font-size: clamp(24px, min(7.5vw, 4.2vh), 34px); font-weight: 800; line-height: 1.25; text-wrap: balance; }
  .lvl-emoji, .emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-weight: 400; }
  .lvl-emoji { display: block; font-size: clamp(72px, min(30vw, 15vh), 150px); line-height: 1.1; margin-top: 1vh; animation: devil .9s cubic-bezier(.2, 1.4, .4, 1) .35s both; }
  @keyframes devil {
    0% { transform: scale(0) rotate(-30deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(12deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .lvl-map { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; width: min(58vw, 25vh, 230px); }
  .lvl-map i { aspect-ratio: 1; border-radius: 3px; background: var(--empty); transition: background-color .45s ease; }
  .lvl-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .lvl-actions.ready { opacity: 1; pointer-events: auto; }
  .lvl-actions .btn { flex: none; }
  .lvl-next { font-size: clamp(15px, 4.3vw, 17px); font-weight: 600; line-height: 1.4; text-wrap: balance; }
  .lvl-next span { display: block; color: var(--muted); font-weight: 400; margin-top: 6px; }

  /* Level and goal */
  .goal { text-align: center; margin-bottom: 14px; flex: none; }
  .stars { font-size: 30px; line-height: 1; letter-spacing: 4px; color: var(--card-down); }
  .stars .on { color: #ffd60a; }
  .goal-bar { height: 8px; border-radius: 4px; background: var(--card); overflow: hidden; }
  .goal-bar i { display: block; height: 100%; background: var(--green); border-radius: 4px; }
  .goal-text { color: var(--muted); font-size: 14px; line-height: 1.4; margin-top: 8px; text-wrap: balance; }
  .goal-text b, .map-goal b { color: var(--fg); }
  .goal-star { font-family: var(--round); font-size: 20px; font-weight: 800; }
  .warn { color: var(--red); }
  .map-goal { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.4; margin: 0 0 12px; text-wrap: balance; }
  .sum.long { font-size: clamp(44px, min(16vw, 9vh), 96px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<section id="home" class="screen">
  <header class="home-head">
    <h1>Times Tables</h1>
    <p id="levelLine"></p>
  </header>
  <div class="go-wrap"><button id="go" class="go">GO</button></div>
  <div id="goal" class="goal"></div>
  <button id="openMap" class="map-card">
    <div id="mini" class="mini" aria-hidden="true"></div>
    <div class="map-text"><b id="miniTitle">Heat map</b><span id="miniText"></span></div>
    <span class="chev" aria-hidden="true">›</span>
  </button>
  <p id="note" class="note" hidden>Preview: progress resets when you close it.</p>
</section>

<section id="play" class="screen">
  <div class="top">
    <button id="quit" class="icon-btn" aria-label="Stop">✕</button>
    <div class="bar"><i id="bar"></i></div>
    <span id="qcount" class="qcount">1/10</span>
  </div>
  <div id="stage" class="stage">
    <div id="sum" class="sum"></div>
    <div id="answer" class="answer"></div>
    <div id="reveal" class="reveal"></div>
    <p id="introText" class="intro-text"></p>
    <p class="intro-hint">Tap to continue</p>
  </div>
  <div id="keypad" class="keypad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <span></span><button data-k="0">0</button><button data-k="del" class="del" aria-label="Delete">⌫</button>
  </div>
</section>

<section id="results" class="screen">
  <div class="res">
    <p id="resScore" class="res-score"></p>
    <p id="resMsg" class="res-msg"></p>
    <div class="stats">
      <div class="stat"><b id="resTime"></b><span>Time taken</span></div>
      <div class="stat"><b id="resAvg"></b><span>Average per sum</span></div>
    </div>
  </div>
  <div class="actions">
    <button id="again" class="btn-go">Go again</button>
    <div class="row">
      <button id="resMap" class="btn">Heat map</button>
      <button id="resHome" class="btn">Home</button>
    </div>
  </div>
</section>

<section id="map" class="screen">
  <div class="map-top">
    <button id="mapBack" class="back">‹ Home</button>
    <h2 id="mapTitle">Heat map</h2>
    <span class="spacer"></span>
  </div>
  <div id="grid" class="grid"></div>
  <p id="info" class="info"></p>
  <p id="mapGoal" class="map-goal"></p>
  <div class="legend">
    <div><i class="c-green"></i><span id="lGreen"></span><b id="nGreen">0</b></div>
    <div><i class="c-amber"></i><span id="lAmber"></span><b id="nAmber">0</b></div>
    <div><i class="c-red"></i><span id="lRed"></span><b id="nRed">0</b></div>
    <div><i></i><span>Not tried</span><b id="nNone">144</b></div>
  </div>
  <div class="data">
    <button id="backup" class="btn-small">Back up</button>
    <label for="file" class="btn-small">Restore</label>
    <button id="reset" class="btn-small danger">Reset</button>
  </div>
  <input id="file" class="vh" type="file" accept=".json,.txt,application/json,text/plain">
</section>

<div id="modal" class="modal" hidden>
  <div class="sheet">
    <p id="modalText"></p>
    <div class="row">
      <button id="modalNo" class="btn">Cancel</button>
      <button id="modalYes" class="btn"></button>
    </div>
  </div>
</div>
<div id="levelUp" class="levelup" hidden>
  <div class="lvl-body" role="alertdialog" aria-labelledby="lvlText">
    <p id="lvlText" class="lvl-text"></p>
    <div id="lvlMap" class="lvl-map" aria-hidden="true"></div>
    <p id="lvlNext" class="lvl-next"></p>
    <div id="lvlActions" class="lvl-actions">
      <button id="lvlGo" class="btn-go">Bring it on</button>
      <button id="keepPlaying" class="btn-go" hidden>Keep playing</button>
      <button id="startAgain" class="btn" hidden>Start again</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
  'use strict';

  /* ---------- Settings: easy to tweak ---------- */
  const QUESTIONS = 10;
  // Each level: green under / red from (ms), whether division is mixed in, and what it takes to move on:
  // either perfect rounds (stars), or a % of the map green with no red or untried squares
  const LEVELS = [
    { green: 4000, red: 8000, division: false, stars: 5 },
    { green: 4000, red: 8000, division: true, stars: 5 },
    { green: 2500, red: 5000, division: false, pct: 75 },
    { green: 2500, red: 5000, division: true, pct: 100 },
    { green: 2000, red: 4000, division: true, pct: 90 },
    { green: 1500, red: 3000, division: true, pct: 75 }
  ];
  const LEVEL_UP_MESSAGES = {
    2: 'Smashed it! Now try them backwards ➗',
    3: 'Congratulations! Now let’s make it harder 😈',
    4: 'Division’s back, and this time it’s fast ⚡',
    5: 'Getting scary good… faster! 🔥',
    6: 'Still too easy huh… ok then, beat this! 👿'
  };
  const SUPERSTAR_MESSAGE = 'You’re a maths superstar! 🌟';
  // What changes at each level, shown under the level-up message
  const WHATS_NEW = {
    2: 'Division joins in, at the same speeds:',
    3: 'Just times tables, but faster:',
    4: 'Division’s back, at the same speeds:',
    5: 'Faster again:',
    6: 'The last level:'
  };
  const ROLLING = 5;             // each square averages its last 5 answers at the current level
  const MAX_COUNTED = 10000;     // one distracted answer counts as at most 10 seconds
  const KEEP = 20;               // answers stored per square
  const REPEATS = 5;             // levels 1 and 2: squares she's struggling with that come back each round
  const REINFORCE = 2;           // green squares mixed into every round to keep them sharp
  const WEAK_WHILE_FILLING = 3;  // red/amber squares per round while some squares are still untried
  const STORE_KEY = 'times-tables-v1';

  const $ = sel => document.querySelector(sel);

  /* ---------- Storage ---------- */
  // Uses the phone's local storage when deployed. Previews that block storage fall back to memory.
  const store = (() => {
    let ls = null, mem = null;
    try {
      const probe = '__tt_probe__';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      ls = window.localStorage;
    } catch (e) { ls = null; }
    return {
      persistent: !!ls,
      load() {
        try {
          const raw = ls ? ls.getItem(STORE_KEY) : mem;
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      },
      save(obj) {
        mem = JSON.stringify(obj);
        if (ls) { try { ls.setItem(STORE_KEY, mem); } catch (e) { /* storage full or blocked */ } }
      }
    };
  })();

  const blank = () => ({ v: 2, level: 1, stars: 0, superstar: false, seenIntro: false, facts: {}, sessions: [] });
  const isNum = x => typeof x === 'number' && isFinite(x);
  const levelOf = x => (Number.isInteger(x) && x >= 1 && x <= LEVELS.length) ? x : 1;

  // Rebuilds data from storage or a backup file, dropping anything malformed.
  // Data from the first version (different levels) carries over into Level 1.
  function clean(d) {
    if (!d || typeof d !== 'object' || !d.facts || typeof d.facts !== 'object') return null;
    const legacy = d.v !== 2;
    const out = blank();
    if (!legacy) {
      out.level = levelOf(d.level);
      out.stars = isNum(d.stars) ? Math.max(0, Math.min(Math.floor(d.stars), 99)) : 0;
      out.superstar = d.superstar === true;
      out.seenIntro = d.seenIntro === true;
    }
    for (let a = 1; a <= 12; a++) {
      for (let b = 1; b <= 12; b++) {
        const key = a + 'x' + b;
        const f = d.facts[key];
        if (!f || !Array.isArray(f.r)) continue;
        const r = f.r
          .filter(x => Array.isArray(x) && isNum(x[0]) && x[0] >= 0)
          .slice(-KEEP)
          .map(x => [Math.round(x[0]), x[1] ? 1 : 0, legacy ? 1 : levelOf(x[2]), x[3] ? 1 : 0]);
        if (!r.length) continue;
        const n = Math.max(isNum(f.n) ? f.n : 0, r.length);
        const c = Math.min(Math.max(isNum(f.c) ? f.c : 0, 0), n);
        out.facts[key] = { n, c, r, t: isNum(f.t) ? f.t : 0 };
      }
    }
    if (Array.isArray(d.sessions)) {
      out.sessions = d.sessions
        .filter(s => s && isNum(s.d) && isNum(s.s) && isNum(s.ms))
        .slice(-1000)
        .map(s => ({ d: s.d, s: s.s, ms: s.ms, l: legacy ? 1 : levelOf(s.l), p: s.p ? 1 : 0 }));
    }
    return out;
  }

  let data = clean(store.load()) || blank();
  const save = () => store.save(data);

  /* ---------- Scoring ---------- */
  const lvl = () => LEVELS[data.level - 1];
  const bandOf = ms => ms < lvl().green ? 'green' : ms < lvl().red ? 'amber' : 'red';

  // How a square is doing, from its last 5 answers at the current level only
  function stats(a, b) {
    const f = data.facts[a + 'x' + b];
    if (!f || !f.r.length) return { band: 'none' };
    const recent = f.r.filter(x => x[2] === data.level).slice(-ROLLING);
    if (!recent.length) return { band: 'amber', fresh: true }; // known from an earlier level, not yet won back
    let total = 0;
    for (const [ms, ok] of recent) {
      total += Math.min(ok ? ms : Math.max(ms, lvl().red), MAX_COUNTED); // a wrong answer counts as red
    }
    const avg = total / recent.length;
    return { band: bandOf(avg), avg, tries: recent.length, wrong: recent.filter(x => !x[1]).length };
  }

  function record(q, ms, ok) {
    const key = q.a + 'x' + q.b;
    const f = data.facts[key] || (data.facts[key] = { n: 0, c: 0, r: [], t: 0 });
    f.n += 1;
    if (ok) f.c += 1;
    f.r.push([Math.round(ms), ok ? 1 : 0, data.level, q.div ? 1 : 0]);
    if (f.r.length > KEEP) f.r.splice(0, f.r.length - KEEP);
    f.t = Date.now();
    save();
  }

  function bandsNow() {
    const out = [];
    for (let a = 1; a <= 12; a++) for (let b = 1; b <= 12; b++) out.push(stats(a, b).band);
    return out;
  }

  function tally() {
    const t = { green: 0, amber: 0, red: 0, none: 0 };
    bandsNow().forEach(band => { t[band] += 1; });
    return t;
  }

  const secs = ms => (ms / 1000).toFixed(1) + 's';
  const plain = ms => String(ms / 1000);
  const emo = s => `<span class="emo">${s}</span>`;

  /* ---------- Levels ---------- */
  const greenNeeded = () => Math.ceil(144 * lvl().pct / 100);

  function goalMet() {
    const L = lvl();
    if (L.stars) return data.stars >= L.stars;
    const t = tally();
    return t.green >= greenNeeded() && t.red === 0 && t.none === 0;
  }

  function levelLine() {
    const L = lvl();
    return `Level ${data.level} of ${LEVELS.length}: ${L.division ? 'times tables and division' : 'times tables'}, green under ${plain(L.green)}s`;
  }

  // What it takes to reach the next level, as a sentence (and a progress figure for the home screen)
  function goalParts() {
    const L = lvl();
    if (data.superstar) return { text: 'Every level beaten. Keep the map green!' };
    if (L.stars) {
      const got = Math.min(data.stars, L.stars);
      return { stars: got, text: `<b>${got} of ${L.stars}</b> perfect rounds to level up. All ten green earns a star.` };
    }
    const t = tally(), need = greenNeeded();
    let text = `<b>${Math.min(t.green, need)} of ${need}</b> green to level up.`;
    if (t.red) text += ` <span class="warn">No reds allowed: ${t.red} to clear.</span>`;
    if (t.none) text += ` ${t.none} ${t.none === 1 ? 'square' : 'squares'} still to try.`;
    return { bar: Math.min(1, t.green / need), text };
  }

  // How to reach the next level, in a sentence
  function goalSentence() {
    const L = lvl();
    const next = data.level < LEVELS.length ? `progress to Level ${data.level + 1}` : 'become a maths superstar';
    if (L.stars) return `Complete ${L.stars} perfect rounds (all ten green) to ${next}.`;
    if (L.pct === 100) return `Turn your whole heat map green to ${next}.`;
    return `Turn ${L.pct}% of your heat map green, with no reds, to ${next}.`;
  }

  /* ---------- Screens ---------- */
  const SCREENS = ['home', 'play', 'results', 'map'];
  function show(id) {
    SCREENS.forEach(s => $('#' + s).classList.toggle('active', s === id));
    if (id === 'home') renderHome();
    if (id === 'map') { renderMap(); $('#map').scrollTop = 0; }
  }

  function renderHome() {
    $('#levelLine').textContent = levelLine();
    const g = goalParts();
    let visual = '';
    if (data.superstar) visual = `<p class="goal-star">Maths superstar ${emo('🌟')}</p>`;
    else if (g.stars !== undefined) {
      let row = '';
      for (let i = 0; i < lvl().stars; i++) row += `<span class="${i < g.stars ? 'on' : ''}">★</span>`;
      visual = `<div class="stars" aria-hidden="true">${row}</div>`;
    } else visual = `<div class="goal-bar"><i style="width:${Math.round(g.bar * 100)}%"></i></div>`;
    $('#goal').innerHTML = `${visual}<p class="goal-text">${g.text}</p>`;

    let html = '';
    bandsNow().forEach(band => { html += `<i class="c-${band}"></i>`; });
    $('#mini').innerHTML = html;
    const t = tally();
    $('#miniText').textContent = t.none === 144 ? 'Play a round to start filling it in' : `${t.green} green, ${t.amber} amber, ${t.red} red`;
  }

  /* ---------- A round of ten ---------- */
  const sumEl = $('#sum'), ansEl = $('#answer'), revEl = $('#reveal');
  const stageEl = $('#stage'), padEl = $('#keypad'), barEl = $('#bar'), countEl = $('#qcount');
  let game = null;

  const shuffle = list => {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  };

  // How a round is built.
  // Levels 1 and 2 (stars): up to 5 repeats of squares she's been slow or wrong on at this
  // level, reds first, then the rest at random. Repeats keep coming back until they're green.
  // Levels 3 to 6 (map): two green squares to keep them sharp, then red and amber squares
  // (capped at 3 while any squares are untried, so the map keeps filling), then untried ones.
  // In division levels, half the ten are division, and a repeat comes back in the form she
  // struggled with, so a slow 63 ÷ 9 returns as 63 ÷ 9. Division counts towards 7 × 9.
  function pickQuestions() {
    const squares = [];
    for (let a = 1; a <= 12; a++) {
      for (let b = 1; b <= 12; b++) {
        const f = data.facts[a + 'x' + b];
        const s = stats(a, b);
        squares.push({ a, b, band: s.band, fresh: !!s.fresh, seen: f ? f.t : 0, rnd: Math.random() });
      }
    }
    const picks = shuffle(lvl().stars ? pickForStars(squares) : pickForMap(squares));
    return withForms(picks).map(p => ({
      a: p.a, b: p.b, div: p.div,
      text: p.div ? `${p.a * p.b} ÷ ${p.b}` : `${p.a} × ${p.b}`,
      ans: String(p.div ? p.a : p.a * p.b)
    }));
  }

  // Squares she's actually been slow or wrong on at this level (not ones carried over from an earlier level)
  const isWeak = s => (s.band === 'red' || s.band === 'amber') && !s.fresh;
  const byRandom = (x, y) => x.rnd - y.rnd;
  const oldestFirst = (x, y) => (x.seen - y.seen) || (x.rnd - y.rnd);
  const redsFirst = (x, y) => ((x.band === 'red' ? 0 : 1) - (y.band === 'red' ? 0 : 1)) || oldestFirst(x, y);

  function pickForStars(squares) {
    const repeats = squares.filter(isWeak).sort(redsFirst).slice(0, REPEATS);
    const rest = squares.filter(s => !repeats.includes(s)).sort(byRandom);
    return repeats.concat(rest.slice(0, QUESTIONS - repeats.length));
  }

  function pickForMap(squares) {
    const green = squares.filter(s => s.band === 'green').sort(oldestFirst);
    const weak = squares.filter(s => s.band === 'red' || s.band === 'amber').sort(redsFirst);
    const untried = squares.filter(s => s.band === 'none').sort(byRandom);
    const picks = [];
    const take = (list, n) => {
      while (n > 0 && list.length && picks.length < QUESTIONS) { picks.push(list.shift()); n -= 1; }
    };
    take(green, REINFORCE);
    take(weak, untried.length ? WEAK_WHILE_FILLING : QUESTIONS);
    take(untried, QUESTIONS);
    take(weak, QUESTIONS);
    take(green, QUESTIONS);
    return picks;
  }

  // The form of her latest slow or wrong answer on a square: division (true) or multiplication (false)
  function weakForm(a, b) {
    const f = data.facts[a + 'x' + b];
    const recent = f ? f.r.filter(x => x[2] === data.level).slice(-ROLLING) : [];
    for (let i = recent.length - 1; i >= 0; i--) {
      const [ms, ok, , op] = recent[i];
      if (!ok || ms >= lvl().green) return op === 1;
    }
    return null;
  }

  // Decides which sums are asked as division: repeats keep their form, the rest make it up to half
  function withForms(picks) {
    if (!lvl().division) return picks.map(p => ({ ...p, div: false }));
    const forms = picks.map(p => isWeak(p) ? weakForm(p.a, p.b) : null);
    let divsLeft = Math.max(0, Math.ceil(picks.length / 2) - forms.filter(f => f === true).length);
    shuffle(forms.map((f, i) => f === null ? i : -1).filter(i => i >= 0)).forEach(i => {
      forms[i] = divsLeft > 0;
      if (divsLeft > 0) divsLeft -= 1;
    });
    return picks.map((p, i) => ({ ...p, div: forms[i] === true }));
  }

  // A timer that is cancelled if the round is stopped
  function later(fn, ms) {
    const g = game;
    if (!g) return;
    g.timers.push(setTimeout(() => { if (game === g) fn(); }, ms));
  }

  function startRound() {
    if (game) return;
    game = { qs: pickQuestions(), i: 0, typed: '', t0: 0, hiddenAt: 0, results: [], locked: true, timers: [], intro: null };
    barEl.style.width = '0%';
    countEl.textContent = `1/${QUESTIONS}`;
    ansEl.textContent = '';
    ansEl.className = 'answer';
    revEl.textContent = '';
    stageEl.classList.remove('intro');
    stageEl.classList.add('counting');
    padEl.classList.add('dim');
    show('play');
    if (data.seenIntro) countdown(3); else introStep(0);
  }

  function countdown(n) {
    if (n === 0) {
      stageEl.classList.remove('counting');
      padEl.classList.remove('dim');
      ask();
      return;
    }
    sumEl.className = 'sum';
    void sumEl.offsetWidth; // restart the pop animation
    sumEl.className = 'sum count';
    sumEl.textContent = n;
    later(() => countdown(n - 1), 700);
  }

  // First time only: the countdown doubles as how to play, one tap per step
  function introLines() {
    const L = lvl();
    const g = plain(L.green), r = plain(L.red);
    return [
      `Answer these ${L.division ? 'times tables and division' : 'times tables'} sums within ${g} seconds to get a green square on your heat map.`,
      `If you take between ${g} and ${r} seconds, it goes amber. Over ${r} seconds it’s red.`,
      goalSentence()
    ];
  }

  let introAt = 0;
  function introStep(step) {
    const lines = introLines();
    introAt = performance.now();
    sumEl.className = 'sum';
    void sumEl.offsetWidth; // restart the pop animation
    sumEl.className = 'sum count';
    if (step < lines.length) {
      game.intro = step;
      stageEl.classList.add('intro');
      sumEl.textContent = String(lines.length - step);
      $('#introText').textContent = lines[step];
      return;
    }
    game.intro = null;
    stageEl.classList.remove('intro');
    sumEl.textContent = 'GO!';
    data.seenIntro = true;
    save();
    padEl.classList.remove('dim');
    later(() => { stageEl.classList.remove('counting'); ask(); }, 700);
  }

  $('#play').addEventListener('click', e => {
    if (!game || game.intro === null || e.target.closest('#quit')) return;
    if (performance.now() - introAt < 350) return; // a quick double tap shouldn't skip a step
    introStep(game.intro + 1);
  });

  function ask() {
    const q = game.qs[game.i];
    game.typed = '';
    sumEl.className = q.text.length > 7 ? 'sum long' : 'sum';
    sumEl.textContent = q.text;
    ansEl.textContent = '';
    ansEl.className = 'answer';
    revEl.textContent = '';
    countEl.textContent = `${game.i + 1}/${QUESTIONS}`;
    game.locked = false;
    game.t0 = performance.now();
    const g = game;
    // Start the clock when the sum is actually on screen
    requestAnimationFrame(() => { if (game === g && !g.locked && g.typed === '') g.t0 = performance.now(); });
  }

  function press(key) {
    if (!game || game.locked) return;
    const q = game.qs[game.i];
    if (key === 'del') {
      game.typed = game.typed.slice(0, -1);
      ansEl.textContent = game.typed;
      return;
    }
    if (!game.typed && key === '0') return; // no answer starts with 0
    game.typed += key;
    ansEl.textContent = game.typed;
    // Marks itself once the right number of digits is in, so there's no Enter button eating time
    if (game.typed.length >= q.ans.length) submit(game.typed === q.ans, performance.now() - game.t0);
  }

  function submit(ok, ms) {
    game.locked = true;
    const q = game.qs[game.i];
    game.results.push({ ok, ms });
    record(q, ms, ok);
    barEl.style.width = ((game.i + 1) / QUESTIONS * 100) + '%';
    if (ok) {
      ansEl.className = 'answer ok';
      later(nextQuestion, 300);
    } else {
      ansEl.className = 'answer bad';
      revEl.textContent = q.ans;
      later(nextQuestion, 1500);
    }
  }

  function nextQuestion() {
    game.i += 1;
    if (game.i < QUESTIONS) ask(); else finishRound();
  }

  function stopRound() {
    if (game) game.timers.forEach(clearTimeout);
    game = null;
  }

  function quitRound() {
    stopRound();
    show('home');
    checkProgress();
  }

  function finishRound() {
    const results = game.results;
    stopRound();
    const L = lvl();
    const score = results.filter(r => r.ok).length;
    const total = results.reduce((s, r) => s + r.ms, 0);
    const avg = total / results.length;
    const perfect = results.length === QUESTIONS && results.every(r => r.ok && r.ms < L.green);
    if (L.stars && perfect && !data.superstar) data.stars += 1;
    data.sessions.push({ d: Date.now(), s: score, ms: Math.round(total), l: data.level, p: perfect ? 1 : 0 });
    if (data.sessions.length > 1000) data.sessions.splice(0, data.sessions.length - 1000);
    save();
    $('#resScore').innerHTML = `${score}<small>/${QUESTIONS}</small>`;
    $('#resMsg').innerHTML = L.stars && perfect
      ? `Perfect round! ${emo('⭐')} ${Math.min(data.stars, L.stars)} of ${L.stars}`
      : cheer(score, avg);
    $('#resTime').textContent = secs(total);
    const avgEl = $('#resAvg');
    avgEl.textContent = secs(avg);
    avgEl.className = 't-' + bandOf(avg);
    show('results');
    checkProgress();
  }

  function cheer(score, avg) {
    if (score === QUESTIONS && avg < lvl().green) return 'Perfect, and lightning fast!';
    if (score === QUESTIONS) return 'Perfect round!';
    if (score >= 8) return 'Great work!';
    if (score >= 5) return 'Good effort. Keep going!';
    return 'Keep practising, you’ll get there!';
  }

  // Keypad reacts on touch-down rather than release, so timing is as fair as possible
  padEl.addEventListener('pointerdown', e => {
    const btn = e.target.closest('button[data-k]');
    if (!btn) return;
    e.preventDefault();
    btn.classList.add('down');
    setTimeout(() => btn.classList.remove('down'), 120);
    press(btn.dataset.k);
  });

  // A keyboard works too, for testing on a computer
  document.addEventListener('keydown', e => {
    if (!game) return;
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
    else if (e.key === 'Escape') quitRound();
  });

  // Time spent with the app in the background doesn't count
  document.addEventListener('visibilitychange', () => {
    if (!game || game.locked) return;
    if (document.hidden) game.hiddenAt = performance.now();
    else if (game.hiddenAt) { game.t0 += performance.now() - game.hiddenAt; game.hiddenAt = 0; }
  });

  /* ---------- Levelling up ---------- */
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let celebrationTimers = [];

  function checkProgress() {
    if (!goalMet()) return;
    if (data.level < LEVELS.length) {
      const before = bandsNow();
      data.level += 1;
      data.stars = 0;
      save();
      celebrate(LEVEL_UP_MESSAGES[data.level], before, bandsNow(), false);
    } else if (!data.superstar) {
      data.superstar = true;
      save();
      const now = bandsNow();
      celebrate(SUPERSTAR_MESSAGE, now, now, true);
    }
  }

  // Full-screen message with a huge emoji, and the map sweeping across to its new colours
  function celebrate(message, from, to, superstar) {
    const textEl = $('#lvlText');
    const cut = message.lastIndexOf(' ');
    textEl.textContent = message.slice(0, cut + 1);
    const emoji = document.createElement('span');
    emoji.className = 'lvl-emoji';
    emoji.textContent = message.slice(cut + 1);
    textEl.appendChild(emoji);

    const map = $('#lvlMap');
    let html = '', i = 0;
    for (let a = 1; a <= 12; a++) {
      for (let b = 1; b <= 12; b++) html += `<i class="c-${from[i++]}" style="transition-delay:${(a + b - 2) * 35}ms"></i>`;
    }
    map.innerHTML = html;
    $('#lvlGo').hidden = superstar;
    const next = $('#lvlNext');
    next.hidden = superstar;
    if (!superstar) {
      const L = lvl();
      next.innerHTML = `${WHATS_NEW[data.level]} green under ${plain(L.green)}s, red over ${plain(L.red)}s.<span>Your map starts fresh. ${goalSentence()}</span>`;
    }
    $('#keepPlaying').hidden = !superstar;
    $('#startAgain').hidden = !superstar;
    const actions = $('#lvlActions');
    actions.classList.remove('ready');
    $('#levelUp').hidden = false;
    celebrationTimers.forEach(clearTimeout);
    celebrationTimers = [
      setTimeout(() => { [...map.children].forEach((cell, k) => { cell.className = 'c-' + to[k]; }); }, calm ? 0 : 1300),
      setTimeout(() => actions.classList.add('ready'), calm ? 0 : (superstar ? 1200 : 2400))
    ];
  }

  function closeCelebration() {
    $('#levelUp').hidden = true;
    if ($('#home').classList.contains('active')) renderHome();
  }

  $('#lvlGo').addEventListener('click', closeCelebration);
  $('#keepPlaying').addEventListener('click', closeCelebration);
  $('#startAgain').addEventListener('click', () => {
    confirmBox('Start again from Level 1? This wipes all progress on this phone.', 'Start again', true, () => {
      data = blank();
      save();
      selected = null;
      $('#levelUp').hidden = true;
      show('home');
      toast('Back to Level 1');
    });
  });

  /* ---------- Heat map ---------- */
  const gridEl = $('#grid'), infoEl = $('#info');
  let selected = null;

  function renderMap() {
    const bands = bandsNow();
    let html = '<span class="hd corner">×</span>';
    for (let b = 1; b <= 12; b++) html += `<span class="hd" data-col="${b}">${b}</span>`;
    let i = 0;
    for (let a = 1; a <= 12; a++) {
      html += `<span class="hd" data-row="${a}">${a}</span>`;
      for (let b = 1; b <= 12; b++) {
        html += `<button class="sq c-${bands[i++]}" data-a="${a}" data-b="${b}" aria-label="${a} times ${b}"></button>`;
      }
    }
    gridEl.innerHTML = html;
    const L = lvl();
    $('#lGreen').textContent = `Under ${plain(L.green)}s`;
    $('#lAmber').textContent = `${plain(L.green)} to ${plain(L.red)}s`;
    $('#lRed').textContent = `${plain(L.red)}s or more`;
    $('#mapGoal').innerHTML = `Level ${data.level}: ${goalParts().text}`;
    const t = tally();
    $('#nGreen').textContent = t.green;
    $('#nAmber').textContent = t.amber;
    $('#nRed').textContent = t.red;
    $('#nNone').textContent = t.none;
    if (selected) selectSquare(selected[0], selected[1]);
    else infoEl.textContent = 'Tap a square to see its average time.';
  }

  function selectSquare(a, b) {
    selected = [a, b];
    gridEl.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
    gridEl.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
    gridEl.querySelector(`.sq[data-a="${a}"][data-b="${b}"]`).classList.add('sel');
    gridEl.querySelector(`[data-row="${a}"]`).classList.add('on');
    gridEl.querySelector(`[data-col="${b}"]`).classList.add('on');
    const s = stats(a, b);
    if (s.band === 'none') { infoEl.innerHTML = `<b>${a} × ${b}</b> hasn’t come up yet.`; return; }
    if (s.fresh) {
      infoEl.innerHTML = `<b>${a} × ${b}</b> hasn’t come up at this level yet. Under ${plain(lvl().green)}s turns it green.`;
      return;
    }
    const over = s.tries === 1 ? 'from 1 try' : `over the last ${s.tries} tries`;
    const wrongText = s.wrong ? `, with ${s.wrong} wrong` : '';
    infoEl.innerHTML = `<b>${a} × ${b}</b> averages <b class="t-${s.band}">${secs(s.avg)}</b> ${over}${wrongText}.`;
  }

  gridEl.addEventListener('click', e => {
    const sq = e.target.closest('.sq');
    if (sq) selectSquare(+sq.dataset.a, +sq.dataset.b);
  });

  /* ---------- Back up, restore, reset ---------- */
  function backup() {
    const payload = JSON.stringify({ app: 'times-tables', saved: new Date().toISOString(), data });
    const name = `times-tables-backup-${new Date().toISOString().slice(0, 10)}`;
    const files = [
      new File([payload], name + '.json', { type: 'application/json' }),
      new File([payload], name + '.txt', { type: 'text/plain' })
    ];
    // Prefer the phone's share sheet (Save to Files, AirDrop, email); fall back to a download
    if (navigator.share && navigator.canShare) {
      for (const file of files) {
        let ok = false;
        try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
        if (ok) {
          navigator.share({ files: [file], title: 'Times Tables backup' })
            .catch(err => { if (!err || err.name !== 'AbortError') download(payload, name + '.json'); });
          return;
        }
      }
    }
    download(payload, name + '.json');
  }

  function download(text, filename) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast('Backup downloaded');
    } catch (e) {
      toast('Back up works once the app is installed');
    }
  }

  const readText = file => file.text ? file.text() : new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsText(file);
  });

  $('#file').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let parsed = null;
    try { parsed = JSON.parse(await readText(file)); } catch (err) { parsed = null; }
    const incoming = parsed && parsed.app === 'times-tables' ? clean(parsed.data) : null;
    if (!incoming) { toast('Choose a times-tables-backup file'); return; }
    const when = new Date(parsed.saved);
    const which = isNaN(when) ? 'this backup' : 'the backup from ' + when.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    confirmBox(`Restore ${which}? It’s on Level ${incoming.level} and replaces the progress on this phone.`, 'Restore', false, () => {
      data = incoming;
      save();
      selected = null;
      renderMap();
      toast('Progress restored');
    });
  });

  $('#backup').addEventListener('click', backup);
  $('#reset').addEventListener('click', () => {
    confirmBox('Reset all progress on this phone and go back to Level 1? A backup is the only way to get it back.', 'Reset', true, () => {
      data = blank();
      save();
      selected = null;
      renderMap();
      toast('Progress reset');
    });
  });

  /* ---------- Confirm sheet and toast ---------- */
  const modal = $('#modal'), modalYes = $('#modalYes');
  let onYes = null;
  function confirmBox(text, yesLabel, danger, fn) {
    $('#modalText').textContent = text;
    modalYes.textContent = yesLabel;
    modalYes.className = 'btn ' + (danger ? 'btn-danger' : 'btn-ok');
    onYes = fn;
    modal.hidden = false;
  }
  modalYes.addEventListener('click', () => { modal.hidden = true; const fn = onYes; onYes = null; if (fn) fn(); });
  $('#modalNo').addEventListener('click', () => { modal.hidden = true; onYes = null; });
  modal.addEventListener('click', e => { if (e.target === modal) { modal.hidden = true; onYes = null; } });

  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- Wire up ---------- */
  $('#go').addEventListener('click', startRound);
  $('#again').addEventListener('click', startRound);
  $('#openMap').addEventListener('click', () => show('map'));
  $('#resMap').addEventListener('click', () => show('map'));
  $('#resHome').addEventListener('click', () => show('home'));
  $('#mapBack').addEventListener('click', () => show('home'));
  $('#quit').addEventListener('click', quitRound);

  if (!store.persistent) $('#note').hidden = false;

  // Offline support and full-screen launch once it's on the home screen
  try {
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    const installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (installed && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { /* not available in previews */ }

  show('home');
})();
</script>
</body>
</html>
